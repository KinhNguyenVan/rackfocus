[project]
name = "rackfocus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "khoivd", email = "khoivd@imt-soft.com" }
]
requires-python = ">=3.11"
dependencies = []

# Mirrors of services/{core,be}/requirements.txt (used by their Dockerfiles/CI directly).
# For native (no-docker) dev, `uv sync --extra core --extra be` installs both into this
# one venv. Keep in sync by hand if either requirements.txt changes.
[project.optional-dependencies]
core = [
    "faiss-cpu",
    "numpy",
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "onnxruntime",
    "pydantic-settings",
    "pyarrow",
    "boto3",
    "transformers",
    "sentencepiece",
]
be = [
    "fastapi",
    "uvicorn[standard]",
    "grpcio",
    "protobuf",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "msgpack",
    "boto3",
    "httpx",
    "litellm",
    "pydantic-settings",
    "requests",
    "tqdm",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
rackfocus = "rackfocus:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
