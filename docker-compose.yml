name: rackfocus

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [be, fe]
    logging: *logging

  fe:
    build: ./services/fe
    image: ghcr.io/kinhnguyenvan/rackfocus-fe:${TAG:-latest}
    restart: unless-stopped
    logging: *logging

  be:
    build: ./services/be
    image: ghcr.io/kinhnguyenvan/rackfocus-be:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - sc_sock:/var/run/searchcore
    depends_on:
      searchcore: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 3G }
    logging: *logging

  searchcore:
    build: ./services/core
    image: ghcr.io/kinhnguyenvan/rackfocus-core:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      # NVMe! refine.f16 được mmap từ đây — không dùng HDD hay network storage
      - ${SNAPSHOT_HOST_DIR:-./data/snapshots}:/data/snapshots:ro
      - ${MODELS_HOST_DIR:-./data/models}:/models:ro
      - sc_sock:/var/run/searchcore
      # Cache snapshot + encoder tải từ S3. PHẢI ghi được và PHẢI bền:
      #   - hai mount trên đều :ro, không có volume này thì `download_dir` rơi về /tmp
      #     ephemeral -> tải lại vài GB mỗi lần `up --force-recreate`;
      #   - nếu /tmp là tmpfs thì lượng đó bị tính vào cgroup 12G -> nổ giới hạn.
      # Đường dẫn phải khớp MODEL_CACHE_DIR trong .env.
      - sc_cache:/var/cache/searchcore
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(socket.AF_UNIX); s.connect('/var/run/searchcore/sc.sock'); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 30
      # 180s vốn được tính cho việc load index từ bind mount cục bộ, KHÔNG tính thời gian
      # tải qua mạng. Với SNAPSHOT_S3 + ENCODER_S3, lần khởi động lạnh phải kéo ~3.7GB
      # (snapshot ~1.9GB + text encoder ~1.8GB) rồi mới validate checksum và warmup.
      # Đo throughput S3 từ host thật rồi chỉnh lại con số này. Lần khởi động sau có
      # sc_cache thì nhanh như cũ.
      start_period: 600s
    deploy:
      resources:
        limits: { memory: 12G }
    logging: *logging

  # ── postgres + redis: ĐÃ BỎ ────────────────────────────────────────────────────
  # Không service nào trong compose này dùng chúng:
  #   * BE: toàn bộ db/{models,queries,session}.py, deps.py, services/{prefilter,
  #     hydrate}.py vẫn là stub 1 dòng docstring; không có dòng asyncpg/sqlalchemy nào
  #     được gọi. `migrations/versions/` rỗng (chỉ .gitkeep) nên `alembic upgrade head`
  #     không có gì để chạy.
  #   * core: không đụng DB, nó đọc snapshot từ S3.
  # Tệ hơn: BE từng `depends_on: postgres: service_healthy`, tức BE không khởi động nổi
  # khi chưa có một Postgres mà nó không bao giờ gọi tới.
  #
  # Redis cũng chưa dùng: `clients/redis.py` là stub, cache query nằm trong RAM tiến
  # trình (services/cache.py). Cần chia sẻ cache giữa nhiều worker thì mới thêm lại.
  #
  # Mongo KHÔNG cần thêm vào đây: nó là Atlas remote (MONGO_URI dạng mongodb+srv://) và
  # chỉ `services/ingest` dùng, mà ingest chạy offline chứ không nằm trong compose.
  #
  # Postgres vẫn còn cần cho ingest: `ingest/db.py` cấp video_id/scene_idx cho payload
  # embedding (pipeline.py). Đó là đường offline, dựng riêng khi chạy pipeline.

volumes:
  caddy_data:
  sc_sock:
  sc_cache:   # snapshot + encoder tải từ S3, giữ qua các lần recreate container
