name: deploy
on:
  push: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [be, core, fe]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.svc }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /srv/rackfocus
            TAG=${{ github.sha }} docker compose pull be fe
            TAG=${{ github.sha }} docker compose up -d --no-deps be fe
            # searchcore KHÔNG restart tự động — load index mất 2-3 phút, deploy tay khi cần
