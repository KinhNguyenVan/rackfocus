name: deploy
on:
  push: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # cần để push lên GHCR
    strategy:
      matrix:
        svc: [be, core, fe]
    steps:
      - uses: actions/checkout@v4

      - name: Hạ chữ thường tên repo
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3     # bắt buộc cho cache type=gha

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.svc }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}    # tắt cho tới khi có server thật
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /srv/rackfocus
            TAG=${{ github.sha }} docker compose pull be fe
            TAG=${{ github.sha }} docker compose up -d --no-deps be fe
            # searchcore KHÔNG restart tự động — load index mất 2-3 phút, deploy tay khi cần