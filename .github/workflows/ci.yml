name: ci
on:
  pull_request:
  push: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Không huỷ các service khác khi một service hỏng — biết cả 3 cùng lúc thay vì
      # sửa xong cái này mới lộ ra cái kia.
      fail-fast: false
      matrix:
        include:
          - svc: core
            deps: faiss-cpu numpy pyarrow grpcio protobuf
          - svc: be
            deps: faiss-cpu numpy pyarrow grpcio protobuf fastapi 'httpx<0.29' pydantic-settings
          - svc: ingest
            # cv2: stages/__init__.py re-export media.py -> import ở module level.
            # litellm/pymongo/pydantic*: cần cho ingest.domain.
            deps: numpy pandas pyarrow boto3 opencv-python-headless pillow litellm pymongo pydantic pydantic-settings mypy-boto3-s3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # 3.12: ingest.domain dùng PEP 695 (`type X = ...`), 3.11 sẽ SyntaxError.
        # Khớp requires-python trong pyproject.toml.
        with: { python-version: "3.12" }

      - run: pip install pytest

      # Stub gRPC là artifact sinh ra lúc build (đã gitignore) — thiếu nó thì core/be
      # không import được gì cả.
      - name: Sinh stub gRPC
        if: matrix.svc != 'ingest'
        run: |
          pip install grpcio-tools
          bash scripts/gen_proto.sh

      - name: Cài dependency cho test
        run: pip install ${{ matrix.deps }}

      # Snapshot là hợp đồng offline↔online thứ hai, ngang `.proto`. `.proto` có job
      # `buf breaking` canh; snapshot chỉ có mấy test này canh, nên chúng phải chạy.
      - run: pytest services/${{ matrix.svc }}/tests -q

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: bufbuild/buf-setup-action@v1

      # Lint luôn chạy, ở cả push và PR
      - name: buf lint
        run: buf lint proto

      # Chỉ so breaking change trên PR — push vào main là so với chính nó
      - name: Lấy nhánh main về local
        if: github.event_name == 'pull_request'
        run: git fetch origin main:main

      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking proto --against ".git#branch=main,subdir=proto"
