name: ci
on:
  pull_request:
  push: { branches: [main] }

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [core, be, ingest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff pytest
      - run: ruff check services/${{ matrix.svc }}/src
      # - run: pytest services/${{ matrix.svc }}/tests -q

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: bufbuild/buf-setup-action@v1

      # Lint luôn chạy, ở cả push và PR
      - name: buf lint
        run: buf lint proto

      # Chỉ so breaking change trên PR — push vào main là so với chính nó
      - name: Lấy nhánh main về local
        if: github.event_name == 'pull_request'
        run: git fetch origin main:main

      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking proto --against ".git#branch=main,subdir=proto"
